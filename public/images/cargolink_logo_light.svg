<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 66" width="270" height="66">
  <defs>
    <linearGradient id="logoGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#165491" />
    </linearGradient>
    <linearGradient id="accentGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>

  <!-- Logo Mark Icon (with subtle white border for dark backgrounds) -->
  <rect x="4" y="9" width="48" height="48" rx="14" fill="url(#logoGradLight)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
  
  <!-- Cargo Ship / Wings Vector Icon -->
  <path d="M16 37 L28 21 L40 37 H34 L28 29 L22 37 Z" fill="#FFFFFF" />
  <path d="M18 40 H38 C38 44 33 46 28 46 C23 46 18 44 18 40 Z" fill="url(#accentGradLight)" />
  <circle cx="28" cy="19" r="3" fill="#38BDF8" />

  <!-- Typography (WHITE FOR Cargo, BRIGHT BLUE FOR Link) -->
  <text x="64" y="34" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" letter-spacing="-0.3">Cargo<tspan fill="#38BDF8">Link</tspan></text>
  
  <!-- AFRICA Pill Badge (Bright Blue Badge) -->
  <rect x="195" y="16" width="58" height="19" rx="9.5" fill="#38BDF8" />
  <text x="224" y="29.5" font-family="'Outfit', system-ui, sans-serif" font-size="9.5" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="1">AFRICA</text>
  
  <!-- Subtitle (Light slate text for dark backgrounds) -->
  <text x="65" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#94A3B8" letter-spacing="1.2">LOGISTIQUE CHINE - AFRIQUE</text>
</svg>
